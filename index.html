<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JIO-BP Spot Check Vehicle Search</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f3f6f9;
        color: #1f2937;
    }

    /* HEADER */
    .header {
        background: linear-gradient(135deg, #075985, #0284c7);
        color: white;
        padding: 22px 30px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .header-content {
        max-width: 1200px;
        margin: auto;
    }

    .title {
        font-size: 26px;
        font-weight: 700;
    }

    .subtitle {
        margin-top: 5px;
        font-size: 14px;
        opacity: 0.9;
    }

    /* MAIN */
    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    /* SEARCH CARD */
    .search-card {
        background: white;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        margin-bottom: 20px;
    }

    .search-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 15px;
    }

    .search-box {
        display: flex;
        gap: 10px;
    }

    .search-input {
        flex: 1;
        height: 52px;
        border: 2px solid #d1d5db;
        border-radius: 10px;
        padding: 0 18px;
        font-size: 18px;
        outline: none;
        text-transform: uppercase;
    }

    .search-input:focus {
        border-color: #0284c7;
        box-shadow: 0 0 0 3px rgba(2,132,199,0.12);
    }

    .clear-btn {
        border: none;
        background: #64748b;
        color: white;
        padding: 0 22px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .clear-btn:hover {
        background: #475569;
    }

    .hint {
        margin-top: 10px;
        color: #64748b;
        font-size: 13px;
    }

    /* STATUS */
    .status-card {
        display: none;
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 700;
    }

    .status-checked {
        display: block;
        background: #fee2e2;
        color: #991b1b;
        border-left: 6px solid #dc2626;
    }

    .status-new {
        display: block;
        background: #dcfce7;
        color: #166534;
        border-left: 6px solid #16a34a;
    }

    /* RESULTS */
    .results-card {
        background: white;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        overflow: hidden;
    }

    .results-header {
        padding: 18px 22px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 18px;
        font-weight: 700;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f1f5f9;
        color: #334155;
        padding: 14px;
        text-align: left;
        font-size: 14px;
    }

    td {
        padding: 14px;
        border-top: 1px solid #e5e7eb;
        font-size: 14px;
    }

    tr:hover {
        background: #f8fafc;
    }

    .vehicle {
        font-weight: 700;
        color: #075985;
        letter-spacing: 0.5px;
    }

    .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
    }

    .badge-checked {
        background: #fee2e2;
        color: #991b1b;
    }

    /* EMPTY */
    .empty {
        text-align: center;
        padding: 45px 20px;
        color: #64748b;
    }

    .empty-icon {
        font-size: 40px;
        margin-bottom: 10px;
    }

    /* FOOTER */
    .footer {
        text-align: center;
        padding: 25px;
        color: #64748b;
        font-size: 13px;
    }

    @media(max-width: 600px) {
        .header {
            padding: 18px;
        }

        .title {
            font-size: 21px;
        }

        .container {
            margin-top: 20px;
        }

        .search-box {
            flex-direction: column;
        }

        .clear-btn {
            height: 48px;
        }

        th, td {
            padding: 10px;
        }
    }
</style>
</head>

/* ==========================================================
   NORMALIZE SEARCH

   Makes:
   GJ45
   gj45
   Gj45
   gJ45
   GJ 45

   all behave the same.
   ========================================================== */

function normalize(value) {

    return value
        .toString()
        .toUpperCase()
        .replace(/\s+/g, "")
        .trim();

}


/* ==========================================================
   SEARCH FUNCTION
   ========================================================== */

function searchVehicle() {

    const input = document.getElementById("vehicleSearch");

    const query = normalize(input.value);

    const resultsBody = document.getElementById("resultsBody");

    const statusCard = document.getElementById("statusCard");


    /* Empty search */

    if (query === "") {

        statusCard.className = "status-card";
        statusCard.innerHTML = "";

        resultsBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty">
                        <div class="empty-icon">🚛</div>
                        Enter a vehicle number to search
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    /* Search */

    const results = vehicleData.filter(row => {

        const vehicle = normalize(row[0]);

        return vehicle.includes(query);

    });


    /* Vehicle found */

    if (results.length > 0) {

        statusCard.className = "status-card status-checked";

        statusCard.innerHTML =
            "⚠️ ALREADY CHECKED — DO NOT CHECK THIS VEHICLE";


        resultsBody.innerHTML = results.map((row, index) => {

            return `
                <tr>

                    <td>${index + 1}</td>

                    <td class="vehicle">
                        ${row[0]}
                    </td>

                    <td>
                        ${row[1]}
                    </td>

                    <td>
                        ${row[2]}
                    </td>

                    <td>
                        <span class="badge badge-checked">
                            ALREADY CHECKED
                        </span>
                    </td>

                </tr>
            `;

        }).join("");

    }


    /* Vehicle NOT found */

    else {

        statusCard.className = "status-card status-new";

        statusCard.innerHTML =
            "✅ VEHICLE NOT FOUND — CHECK THIS VEHICLE";


        resultsBody.innerHTML = `
            <tr>

                <td colspan="5">

                    <div class="empty">

                        <div class="empty-icon">✅</div>

                        <strong>CHECK THIS VEHICLE</strong>

                        <br><br>

                        Vehicle number
                        <strong>${query}</strong>
                        was not found in the checked vehicle list.

                    </div>

                </td>

            </tr>
        `;

    }

}


/* ==========================================================
   CLEAR
   ========================================================== */

function clearSearch() {

    document.getElementById("vehicleSearch").value = "";

    document.getElementById("statusCard").className =
        "status-card";

    document.getElementById("statusCard").innerHTML = "";

    document.getElementById("resultsBody").innerHTML = `
        <tr>
            <td colspan="5">
                <div class="empty">
                    <div class="empty-icon">🚛</div>
                    Enter a vehicle number to search
                </div>
            </td>
        </tr>
    `;

    document.getElementById("vehicleSearch").focus();

}


/* ==========================================================
   LIVE SEARCH
   ========================================================== */

document
    .getElementById("vehicleSearch")
    .addEventListener("input", searchVehicle);


/* ENTER KEY */

document
    .getElementById("vehicleSearch")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            searchVehicle();

        }

    });

</script>

</body>
